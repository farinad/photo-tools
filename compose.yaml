services:
  photo-tools:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PHOTO_TOOLS_BIND_IP:-127.0.0.1}:${PHOTO_TOOLS_PORT:-8097}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
